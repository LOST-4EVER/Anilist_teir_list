<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniTier - Authenticating...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1a1f29;
      border: 1px solid #262d3a;
      padding: 32px 24px;
      border-radius: 16px;
      max-width: 400px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 194, 255, 0.2);
      border-top-color: #00c2ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #fff; }
    p { margin: 0; font-size: 14px; color: #9aa7b4; line-height: 1.5; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .token-box {
      margin-top: 16px;
      background: #11141a;
      border: 1px solid #343d4d;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      word-break: break-all;
      user-select: all;
    }
  </style>
</head>
<body>
  <div class="card" id="statusCard">
    <div class="spinner" id="spinner"></div>
    <h2 id="statusTitle">Authenticating with AniList...</h2>
    <p id="statusMsg">Please wait while we securely connect your AniList account.</p>
  </div>

  <script>
    (function() {
      const ANILIST_API = 'https://graphql.anilist.co';
      
      // Check for token in hash or query params
      const hash = window.location.hash || '';
      const search = window.location.search || '';
      
      const hashParams = new URLSearchParams(hash.startsWith('#') ? hash.substring(1) : hash);
      const searchParams = new URLSearchParams(search);
      
      const token = hashParams.get('access_token') || searchParams.get('access_token');
      const code = hashParams.get('code') || searchParams.get('code');
      const error = hashParams.get('error') || searchParams.get('error');
      const errorDesc = hashParams.get('error_description') || searchParams.get('error_description') || searchParams.get('message');

      const card = document.getElementById('statusCard');
      const spinner = document.getElementById('spinner');
      const title = document.getElementById('statusTitle');
      const msg = document.getElementById('statusMsg');

      if (error) {
        spinner.style.display = 'none';
        title.className = 'error';
        title.textContent = 'Authorization Failed';
        msg.textContent = errorDesc || 'AniList authorization returned an error: ' + error;
        if (window.opener) {
          window.opener.postMessage({ type: 'anitier-auth', error: errorDesc || error }, '*');
        }
        return;
      }

      function verifyAndComplete(accessToken) {
        fetch(ANILIST_API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'Authorization': 'Bearer ' + accessToken
          },
          body: JSON.stringify({
            query: `query { Viewer { id name avatar { large medium } bannerImage } }`
          })
        })
        .then(r => r.json())
        .then(data => {
          spinner.style.display = 'none';
          const user = data.data?.Viewer || null;
          title.className = 'success';
          title.textContent = 'Connected Successfully!';
          msg.textContent = user ? `Logged in as ${user.name}. Closing window...` : 'Connected. Closing window...';

          if (window.opener) {
            window.opener.postMessage({
              type: 'anitier-auth',
              token: accessToken,
              user: user
            }, '*');
            setTimeout(() => {
              window.close();
            }, 800);
          } else {
            msg.innerHTML += '<div class="token-box">Your Token: ' + accessToken.substring(0, 15) + '...</div><p style="margin-top:10px;">Return to AniTier and paste this token if needed.</p>';
          }
        })
        .catch(err => {
          spinner.style.display = 'none';
          title.className = 'error';
          title.textContent = 'Verification Failed';
          msg.textContent = 'Could not verify token with AniList API.';
          if (window.opener) {
            window.opener.postMessage({ type: 'anitier-auth', token: accessToken, user: null }, '*');
          }
        });
      }

      if (token) {
        verifyAndComplete(token);
      } else if (code) {
        // Exchange authorization code via server token endpoint
        title.textContent = 'Exchanging Code...';
        const cleanRedirectUri = window.location.origin + window.location.pathname;
        const customClientId = localStorage.getItem('anitier-clientid') || '4410';

        fetch('/api/auth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: code,
            redirectUri: cleanRedirectUri,
            clientId: customClientId
          })
        })
        .then(r => r.json())
        .then(data => {
          if (data.access_token) {
            verifyAndComplete(data.access_token);
          } else {
            spinner.style.display = 'none';
            title.className = 'error';
            title.textContent = 'Token Exchange Failed';
            const errMsg = data.message || data.error || 'Failed to exchange authorization code.';
            msg.textContent = errMsg;
            if (window.opener) {
              window.opener.postMessage({ type: 'anitier-auth', error: errMsg }, '*');
            }
          }
        })
        .catch(err => {
          spinner.style.display = 'none';
          title.className = 'error';
          title.textContent = 'Token Exchange Error';
          msg.textContent = err.message || 'Server network error during code exchange.';
          if (window.opener) {
            window.opener.postMessage({ type: 'anitier-auth', error: err.message }, '*');
          }
        });
      } else {
        spinner.style.display = 'none';
        title.className = 'error';
        title.textContent = 'No Token or Code Found';
        msg.textContent = 'No access token or authorization code was returned by AniList.';
      }
    })();
  </script>
</body>
</html>
